# Inside an existing <VirtualHost *:443>, for an installation under a path:
#   Include /etc/apache2/activitytrack-web-path.conf
# with [server] base_url = https://<host>/activitytrack in settings.ini.
# a2enmod proxy proxy_http headers (+ xsendfile for [files] offload = apache)

# attachments up to [files] max_mb
<Location /activitytrack/>
	LimitRequestBody 31457280
</Location>

Alias /activitytrack/static/ /var/lib/activitytrack-web/static/
<Directory /var/lib/activitytrack-web/static>
	Require all granted
</Directory>

<IfModule mod_xsendfile.c>
	XSendFile On
	XSendFilePath /var/lib/activitytrack-web/files
</IfModule>

ProxyPass /activitytrack/static/ !
# the prefix is stripped here; Django adds it back to its URLs (FORCE_SCRIPT_NAME)
ProxyPass /activitytrack/ "unix:/run/activitytrack-web.sock|http://localhost/" timeout=90
ProxyPassReverse /activitytrack/ "unix:/run/activitytrack-web.sock|http://localhost/"
<Location /activitytrack/>
	RequestHeader set X-Forwarded-Proto "https"
</Location>
