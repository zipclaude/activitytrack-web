# /etc/apache2/sites-available/activitytrack-web.conf
# a2enmod ssl proxy proxy_http headers (+ xsendfile for [files] offload = apache)
<VirtualHost *:443>
	ServerName at.example.com

	SSLEngine on
	SSLCertificateFile /etc/letsencrypt/live/at.example.com/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/at.example.com/privkey.pem
	Protocols h2 http/1.1

	# attachments up to [files] max_mb
	LimitRequestBody 31457280

	Alias /static/ /var/lib/activitytrack-web/static/
	<Directory /var/lib/activitytrack-web/static>
		Require all granted
		<IfModule mod_expires.c>
			ExpiresActive On
			ExpiresDefault "access plus 7 days"
		</IfModule>
	</Directory>

	# [files] offload = apache: Django checks the permission, Apache sends the file
	<IfModule mod_xsendfile.c>
		XSendFile On
		XSendFilePath /var/lib/activitytrack-web/files
	</IfModule>

	ProxyPreserveHost On
	ProxyTimeout 90
	RequestHeader set X-Forwarded-Proto "https"
	ProxyPass /static/ !
	ProxyPass / "unix:/run/activitytrack-web.sock|http://localhost/"
	ProxyPassReverse / "unix:/run/activitytrack-web.sock|http://localhost/"
</VirtualHost>

<VirtualHost *:80>
	ServerName at.example.com
	Redirect permanent / https://at.example.com/
</VirtualHost>
