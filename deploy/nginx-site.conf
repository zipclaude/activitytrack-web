# /etc/nginx/sites-available/activitytrack-web
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name at.example.com;

	ssl_certificate /etc/letsencrypt/live/at.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/at.example.com/privkey.pem;

	# attachments up to [files] max_mb
	client_max_body_size 30m;

	location /static/ {
		alias /var/lib/activitytrack-web/static/;
		expires 7d;
	}

	# reached only through X-Accel-Redirect after Django checked the permission
	location /_files/ {
		internal;
		alias /var/lib/activitytrack-web/files/;
	}

	location / {
		proxy_pass http://unix:/run/activitytrack-web.sock;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 90s;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name at.example.com;
	return 301 https://$host$request_uri;
}
