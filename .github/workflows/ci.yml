name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # the server must run on Debian stable packages only (docs/ARCHITECTURE.md R1)
    runs-on: ubuntu-latest
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgresql]
    steps:
      - name: Debian packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates \
            python3 python3-django python3-segno python3-argon2 python3-psycopg python3-cryptography gettext
      - uses: actions/checkout@v4
      - name: PostgreSQL
        if: matrix.db == 'postgresql'
        run: |
          apt-get install -y --no-install-recommends postgresql
          pg_ctlcluster 17 main start
          su postgres -c "createuser --createdb root"
          su postgres -c "createdb -O root activitytrack"
          printf '[database]\nengine = postgresql\nname = activitytrack\nuser = root\n' > server/local_settings.ini
      - name: Checks
        working-directory: server
        run: |
          python3 --version
          python3 -c "import django; print('Django', django.__version__)"
          python3 manage.py check
          python3 manage.py makemigrations --check --dry-run
      - name: Tests
        working-directory: server
        run: python3 manage.py test -v 2
