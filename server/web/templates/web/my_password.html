{% extends "web/base.html" %}{% load i18n at %}
{% block title %}{% translate "Cambia password" %} · ActivityTrack{% endblock %}
{% block content %}
<h1>{% translate "Cambia password" %}</h1>
<form method="post" class="card narrowform">{% csrf_token %}
	<label>{% translate "Password attuale" %}<input type="password" name="old" autocomplete="current-password" required autofocus></label>
	<label>{% translate "Nuova password" %}<input type="password" name="password" autocomplete="new-password" required></label>
	<label>{% translate "Ripeti la nuova password" %}<input type="password" name="password2" autocomplete="new-password" required></label>
	<ul class="doc">{% for h in help %}<li>{{ h }}</li>{% endfor %}</ul>
	<button class="primary">{% translate "Cambia password" %}</button>
</form>
{% endblock %}
