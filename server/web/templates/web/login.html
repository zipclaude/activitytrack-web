{% extends "web/base.html" %}{% load i18n %}
{% block title %}{% translate "Accesso" %} · ActivityTrack{% endblock %}
{% block content %}
<section class="card narrow">
	<h1>ActivityTrack</h1>
	<form method="post">{% csrf_token %}
		{% if form.errors %}<p class="note error">{% translate "Nome utente o password errati." %}</p>{% endif %}
		<label>{% translate "Nome utente" %}<input name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}"></label>
		<label>{% translate "Password" %}<input name="password" type="password" autocomplete="current-password" required></label>
		<input type="hidden" name="next" value="{{ next }}">
		<button class="primary">{% translate "Accedi" %}</button>
	</form>
</section>
{% endblock %}
